# OMV Agent Helper — nginx integration
# This file is dropped into OMV's nginx include directory.
# Security-hardened per Agent 3 audit (2026-02-18).

# Inject widget.js into every page before closing </body>
sub_filter_once on;
sub_filter_types text/html;
sub_filter '</body>' '<script src="/omv-agent/static/widget.js"></script></body>';

# Proxy to local Python backend (same-origin = no CSP connect-src violation)
location /omv-agent/ {

    # Rate limiting (FIX-MED-4)
    limit_req zone=omv_agent burst=5 nodelay;
    limit_req_status 429;

    # Input size cap (FIX-MED-3)
    client_max_body_size 8k;

    # Strip the /omv-agent prefix before forwarding
    rewrite ^/omv-agent/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:11111;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_hide_header X-Powered-By;
}

# Serve widget static files
location /omv-agent/static/ {
    alias /usr/lib/omv-agent/static/;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
}
